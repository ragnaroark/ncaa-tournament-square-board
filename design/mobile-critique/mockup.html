<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Square Board Mobile</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column. Board / Results / Leaders live behind a bottom tab bar;
   square detail opens as a bottom sheet. On desktop the column sits inside a phone frame. */
:root{
  --bg:#eef0f4; --surface:#ffffff; --surface-2:#f6f7fa; --line:#d9dde6; --fg:#15202b; --muted:#5b6675;
  --accent:#e8651b; --accent-ink:#ffffff; --court:#1a2b48;
  --r1:#1f9d6a; --r2:#2a6fdb; --r3:#d79a00; --r4:#7c4dcc; --r5:#d1344b; --r6:#f2b705;
  --r1-tint:#d6f2e6; --r2-tint:#dbe7fb; --r3-tint:#fff0c2; --r4-tint:#e9dffb; --r5-tint:#fbdce0; --r6-tint:#ffe88a;
  --win:#1f7a4d; --focus:#2a6fdb;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --radius:12px; --shadow:0 8px 24px rgba(21,32,43,.12);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#1a212b; --surface-2:#222b37; --line:#33404f; --fg:#eef2f7; --muted:#a3adbb; --court:#0b1324;
  --r1-tint:#153f30; --r2-tint:#17305a; --r3-tint:#4a3a08; --r4-tint:#33265a; --r5-tint:#4d1e27; --r6-tint:#5a4300; --win:#4fd08f; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#1a212b; --surface-2:#222b37; --line:#33404f; --fg:#eef2f7; --muted:#a3adbb; --court:#0b1324;
  --r1-tint:#153f30; --r2-tint:#17305a; --r3-tint:#4a3a08; --r4-tint:#33265a; --r5-tint:#4d1e27; --r6-tint:#5a4300; --win:#4fd08f; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}

/* Phone frame on wide screens */
.stage{min-height:100%;display:flex;justify-content:center;align-items:flex-start;padding:0}
.phone{position:relative;width:100%;max-width:430px;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column}
@media (min-width:700px){
  .stage{padding-block:32px;padding-left:16px;padding-right:16px;align-items:center}
  .phone{min-height:0;height:860px;max-height:calc(100vh - 64px);border:10px solid #0b0f14;border-radius:44px;box-shadow:0 30px 60px rgba(0,0,0,.35);overflow:hidden}
  .phone .top{padding-top:14px}
  .desk-note{position:fixed;left:16px;bottom:16px;font-size:12px;color:var(--muted);max-width:260px}
}
.desk-note{display:none}
@media (min-width:700px){.desk-note{display:block}}

/* Top bar */
.top{position:sticky;top:0;z-index:5;background:var(--court);color:#fff;padding-block:10px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px}
.top h1{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:.02em;margin:0;line-height:1;text-transform:uppercase}
.top .sub{font-size:12px;opacity:.75;margin-top:2px}
.top .spacer{flex:1}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.1)}
.iconbtn svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Mine strip */
.minebar{margin:12px max(16px, env(safe-area-inset-right,0px)) 0 max(16px, env(safe-area-inset-left,0px));background:var(--surface);border-radius:var(--radius);padding:10px 12px;display:flex;align-items:center;gap:10px;border:1px solid var(--line)}
.minebar .pin{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px}
.minebar .t{flex:1;min-width:0}
.minebar .t b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.minebar .t span{font-size:12px;color:var(--muted)}
.minebar .amt{font-family:var(--display);font-weight:800;font-size:22px;color:var(--win)}
.minebar button.set{font-size:13px;font-weight:600;color:var(--accent);padding:8px 10px;border-radius:8px;min-height:44px}

/* Views */
main{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
.view{display:none;padding-block:12px 16px;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px))}
.view.on{display:block}
h2{font-family:var(--display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.03em;margin:14px 0 8px}
h2 small{font-family:var(--body);text-transform:none;letter-spacing:0;font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}

/* Round segmented control: the payout schedule *is* the filter */
.seg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{min-height:48px;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:12px;font-weight:700;color:var(--muted);position:relative}
.seg button small{font-size:10px;font-weight:600;color:var(--muted)}
.seg button .dot{width:8px;height:8px;border-radius:50%;background:var(--c,transparent);position:absolute;top:5px;right:6px}
.seg button[aria-pressed="true"]{background:var(--court);color:#fff}
.seg button[aria-pressed="true"] small{color:rgba(255,255,255,.75)}

/* Board */
.boardwrap{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:8px 6px 8px}
.axis{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:4px}
.axis b{color:var(--fg)}
.scroller{overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:18px repeat(10,minmax(0,1fr));gap:1px;width:100%;touch-action:pan-y pan-x}
.grid.large{--cs:56px;grid-template-columns:28px repeat(10,var(--cs));width:max-content;gap:3px}
.hc,.rh{display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:14px;color:var(--muted);height:20px}
.grid.large .hc,.grid.large .rh{font-size:18px}
.rh{height:auto}
.cell{position:relative;aspect-ratio:1;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1px;overflow:hidden;min-width:0;text-align:center;-webkit-tap-highlight-color:transparent;transition:transform .1s}
.cell:active{transform:scale(.94)}
.cell .nm{font-family:var(--display);font-size:9.5px;font-weight:700;line-height:1.05;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0;margin-top:3px}
.cell .nm.full{display:none}
.grid.large .cell .nm.short{display:none}
.grid.large .cell .nm.full{display:-webkit-box;font-family:var(--body);font-size:11px;white-space:normal;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow-wrap:anywhere;margin-top:0}
.cell .id{position:absolute;top:1px;left:2px;font-size:7px;color:var(--muted);font-weight:600}
.grid.large .cell .id{font-size:9px}
.cell .dots{position:absolute;bottom:2px;left:0;right:0;display:flex;justify-content:center;gap:2px}
.cell .dots i{width:5px;height:5px;border-radius:50%;background:var(--c);display:block}
.grid.large .cell .dots i{width:7px;height:7px}
.cell.w1{background:var(--r1-tint)} .cell.w2{background:var(--r2-tint)} .cell.w3{background:var(--r3-tint)} .cell.w4{background:var(--r4-tint)} .cell.w5{background:var(--r5-tint)}
.cell.w6{background:repeating-linear-gradient(135deg,var(--r6-tint) 0 4px,var(--r6) 4px 6px)}
.cell.mine{outline:2px solid var(--accent);outline-offset:-2px}
.cell.mine::after{content:"";position:absolute;top:0;right:0;border-style:solid;border-width:0 9px 9px 0;border-color:transparent var(--accent) transparent transparent}
.cell.dim{opacity:.28}
.cell.hit{box-shadow:0 0 0 3px var(--accent)}
.boardtools{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:11px;color:var(--muted);flex:1;min-width:0}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.toggle button{padding:0 12px;min-height:36px;font-size:12px;font-weight:600;color:var(--muted)}
.toggle button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

/* Search */
.search{position:relative;margin-top:12px}
.search input{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);padding:0 44px 0 42px;font:inherit;font-size:16px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
.search .clr{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;color:var(--muted);font-size:20px;display:none}
.search.has .clr{display:block}
.hits{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.hits button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 12px;min-height:36px;font-size:13px;font-weight:600}
.hits button b{color:var(--muted);font-weight:600;margin-right:4px}

/* Results */
.day{position:sticky;top:0;z-index:2;background:var(--bg);padding:8px 0 6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.game{width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.game .rt{grid-column:1/-1;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.game .rt i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.game .tm{display:flex;align-items:baseline;gap:6px;min-width:0;font-size:15px}
.game .tm .sd{font-size:11px;color:var(--muted);width:14px;text-align:right;flex:none}
.game .tm .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game .tm .sc{font-family:var(--display);font-weight:800;font-size:20px;margin-left:auto;flex:none}
.game .tm.won .n{font-weight:700}
.game .tm.lost{color:var(--muted)}
.game .sq{grid-row:2/4;grid-column:2;align-self:stretch;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;border-left:1px solid var(--line);padding-left:10px;min-width:92px}
.game .sq b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.game .sq span{font-size:11px;color:var(--muted)}
.game .sq em{font-style:normal;font-family:var(--display);font-weight:800;font-size:18px;color:var(--win)}
.game.mine-win{border-color:var(--accent)}
.game.mine-win .sq b::before{content:"★ ";color:var(--accent)}

/* Leaders */
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.stat div{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:22px}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.lead{width:100%;text-align:left;display:grid;grid-template-columns:28px 1fr auto;gap:2px 10px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);min-height:56px}
.lead .rk{font-family:var(--display);font-weight:800;font-size:18px;color:var(--muted);text-align:center}
.lead .nm{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;min-width:0}
.lead .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lead .nm small{color:var(--muted);font-weight:600;font-size:12px;flex:none}
.lead .bar{grid-column:2;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;display:flex}
.lead .bar i{display:block;height:100%;background:var(--c)}
.lead .amt{grid-row:1/3;grid-column:3;font-family:var(--display);font-weight:800;font-size:20px;color:var(--win)}
.lead.mine .nm span{color:var(--accent)}

/* Tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:6;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (max-width:699px){.tabbar{position:fixed}}
.tabbar button{min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted)}
.tabbar button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-selected="true"]{color:var(--accent)}

/* Bottom sheet */
.scrim{position:absolute;inset:0;background:rgba(10,14,20,.5);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
@media (max-width:699px){.scrim,.sheet{position:fixed}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-height:88%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet[aria-hidden="false"]{transform:none}
.scrim.on{opacity:1;pointer-events:auto}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
.sh{display:flex;align-items:flex-start;gap:10px;padding:10px 16px 0}
.sh .sqn{width:48px;height:48px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px;flex:none}
.sh .t{flex:1;min-width:0}
.sh .t h3{margin:0;font-size:20px;font-weight:700;line-height:1.1;overflow-wrap:anywhere}
.sh .t p{margin:3px 0 0;font-size:13px;color:var(--muted)}
.sh .x{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:22px;flex:none}
.sb{overflow-y:auto;padding:12px 16px 20px;overscroll-behavior:contain}
.total{display:flex;align-items:center;justify-content:space-between;background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.total span{font-size:13px;color:var(--muted);font-weight:600}
.total b{font-family:var(--display);font-weight:800;font-size:30px;color:var(--win)}
.setmine{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--accent);color:var(--accent);font-weight:700;font-size:15px;margin-bottom:14px}
.setmine[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.win{display:grid;grid-template-columns:4px 1fr auto;gap:0 10px;padding:8px 0;border-bottom:1px solid var(--line)}
.win i{background:var(--c);border-radius:2px}
.win .m{font-size:14px}
.win .m b{display:block}
.win .m span{font-size:12px;color:var(--muted)}
.win .p{font-family:var(--display);font-weight:800;font-size:18px;color:var(--win);align-self:center}
.empty{color:var(--muted);text-align:center;padding:18px 0;font-size:14px}
.empty b{display:block;color:var(--fg);margin-bottom:4px}
.toast{position:absolute;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:.2s;z-index:30;pointer-events:none;white-space:nowrap}
@media (max-width:699px){.toast{position:fixed}}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<div class="stage">
<div class="phone" id="app">
  <header class="top">
    <div>
      <h1>Square Board</h1>
      <div class="sub" id="subline">NCAA Tournament · 63 games</div>
    </div>
    <div class="spacer"></div>
    <button class="iconbtn" id="btn-find" aria-label="Find my square"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
  </header>

  <div class="minebar" id="mine"></div>

  <main id="main">
    <section class="view on" id="v-board" aria-labelledby="tab-board">
      <div class="seg" id="seg" role="group" aria-label="Filter by round and see the payout per win"></div>
      <div class="search" id="search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Find a name on the board" autocomplete="off" aria-label="Find a name on the board">
        <button class="clr" id="clr" aria-label="Clear search">×</button>
      </div>
      <div class="hits" id="hits"></div>
      <div class="boardwrap">
        <div class="axis">Winner's last digit <b>→</b> &nbsp;·&nbsp; Loser's last digit <b>↓</b></div>
        <div class="scroller"><div class="grid" id="grid" role="grid" aria-label="Square board"></div></div>
        <div class="boardtools">
          <div class="legend" id="legend"></div>
          <div class="toggle" role="group" aria-label="Board size">
            <button id="z-fit" aria-pressed="true">Fit</button><button id="z-big" aria-pressed="false">Large</button>
          </div>
        </div>
      </div>
    </section>

    <section class="view" id="v-results" aria-labelledby="tab-results">
      <div class="seg" id="seg2" role="group" aria-label="Filter results by round"></div>
      <div id="results"></div>
    </section>

    <section class="view" id="v-leaders" aria-labelledby="tab-leaders">
      <div class="stat" id="stats"></div>
      <h2>Leaders <small>tap a name for details</small></h2>
      <div id="leaders"></div>
    </section>
  </main>

  <nav class="tabbar" role="tablist" aria-label="Sections">
    <button role="tab" id="tab-board" aria-selected="true" data-v="board"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>Board</button>
    <button role="tab" id="tab-results" aria-selected="false" data-v="results"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Results</button>
    <button role="tab" id="tab-leaders" aria-selected="false" data-v="leaders"><svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Leaders</button>
  </nav>

  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="sh-title">
    <div class="grab"></div>
    <div class="sh">
      <div class="sqn" id="sh-num">#</div>
      <div class="t"><h3 id="sh-title"></h3><p id="sh-sub"></p></div>
      <button class="x" id="sh-close" aria-label="Close">×</button>
    </div>
    <div class="sb" id="sh-body"></div>
  </div>
  <div class="toast" id="toast" role="status"></div>
</div>
<p class="desk-note">Mockup of the proposed mobile layout, shown inside a phone frame. Open this page on a phone, or narrow the window, to see it full-bleed.</p>

const PAYOUT = {1:100,2:200,3:400,4:800,5:1600,6:4000};
const ROUND = {1:['R64','Round of 64'],2:['R32','Round of 32'],3:['S16','Sweet 16'],4:['E8','Elite 8'],5:['F4','Final Four'],6:['Champ','Championship']};
const money = n => '$' + n.toLocaleString();
/* Fit mode shows a one-word label; Large mode and the sheet show the full name */
const shortName = n => { const w = n.split(/\s+/).filter(x=>!/^[+&]$/.test(x)); return w[0].length>=3 || w.length===1 ? w[0] : (w[0]+' '+w[1]); };
const $ = s => document.querySelector(s);

/* Map each game to a square using the shuffled header digits, same rule as the live board */
const colIdx = {}; DATA.cols.forEach((d,i)=>colIdx[d]=i);
const rowIdx = {}; DATA.rows.forEach((d,i)=>rowIdx[d]=i);
const wins = {}; // cellId -> [game]
DATA.games.forEach(g => { g.cell = rowIdx[g.l.p % 10]*10 + colIdx[g.w.p % 10] + 1; (wins[g.cell] ||= []).push(g); });
const totalOf = id => (wins[id]||[]).reduce((s,g)=>s+PAYOUT[g.round],0);
const topRound = id => Math.max(0, ...(wins[id]||[]).map(g=>g.round));
const played = new Set(DATA.games.map(g=>g.round));

let filter = 'all', mine = [], zoom = 'fit', query = '';
try { mine = JSON.parse(localStorage.getItem('sb.mine')||'[]'); } catch(e){ mine = []; }
const saveMine = () => { try { localStorage.setItem('sb.mine', JSON.stringify(mine)); } catch(e){} };

/* Segmented round filter with payout per win */
function seg(el){
  el.innerHTML = `<button aria-pressed="${filter==='all'}" data-r="all">All<small>rounds</small></button>` +
    [1,2,3,4,5,6].map(r=>`<button aria-pressed="${filter==String(r)}" data-r="${r}" style="--c:var(--r${r})"><span class="dot"></span>${ROUND[r][0]}<small>${money(PAYOUT[r])}</small></button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{ filter=b.dataset.r; render(); });
}

function cellMatches(id){ if(filter==='all') return true; return (wins[id]||[]).some(g=>g.round==filter); }
function nameMatches(id){ return query && DATA.names[id-1].toLowerCase().includes(query); }

function board(){
  const g = $('#grid'); g.className = 'grid' + (zoom==='big'?' large':'');
  let h = `<div class="hc"></div>` + DATA.cols.map(d=>`<div class="hc" role="columnheader">${d}</div>`).join('');
  for(let r=0;r<10;r++){
    h += `<div class="rh" role="rowheader">${DATA.rows[r]}</div>`;
    for(let c=0;c<10;c++){
      const id = r*10+c+1, w = wins[id]||[], tr = topRound(id);
      const shown = filter==='all' ? w : w.filter(x=>x.round==filter);
      const cls = ['cell'];
      if(shown.length) cls.push('w'+(filter==='all'?tr:filter));
      if(mine.includes(id)) cls.push('mine');
      if(query ? !nameMatches(id) : (filter!=='all' && !shown.length)) cls.push('dim');
      if(query && nameMatches(id)) cls.push('hit');
      const dots = shown.slice(0,4).map(x=>`<i style="--c:var(--r${x.round})"></i>`).join('');
      const total = totalOf(id);
      h += `<button class="${cls.join(' ')}" role="gridcell" data-id="${id}" aria-label="Square ${id}, ${DATA.names[id-1]}, ${w.length} win${w.length==1?'':'s'}, ${money(total)}"><span class="id">${id}</span><span class="nm short">${shortName(DATA.names[id-1])}</span><span class="nm full">${DATA.names[id-1]}</span><span class="dots">${dots}</span></button>`;
    }
  }
  g.innerHTML = h;
  g.querySelectorAll('.cell').forEach(b=>b.onclick=()=>openSquare(+b.dataset.id));
  $('#legend').innerHTML = [1,2,3,4,5,6].map(r=>`<span><i style="--c:var(--r${r})"></i>${ROUND[r][1]}${played.has(r)?'':' (upcoming)'}</span>`).join('') + `<span><i style="--c:var(--accent)"></i>Your square</span>`;
}

function hits(){
  const el = $('#hits'); $('#search').classList.toggle('has', !!query);
  if(!query){ el.innerHTML=''; return; }
  const ids = DATA.names.map((n,i)=>i+1).filter(nameMatches);
  el.innerHTML = ids.length ? ids.map(id=>`<button data-id="${id}"><b>#${id}</b>${DATA.names[id-1]} · ${money(totalOf(id))}</button>`).join('') : `<span class="empty" style="padding:4px 0">No square matches “${query}”.</span>`;
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>openSquare(+b.dataset.id));
}

function mineStrip(){
  const el = $('#mine');
  if(!mine.length){
    el.innerHTML = `<div class="pin">?</div><div class="t"><b>Which square is yours?</b><span>Tap your name on the board, then “This is my square”.</span></div><button class="set" id="mine-find">Find</button>`;
    $('#mine-find').onclick = ()=>{ showView('board'); $('#q').focus(); };
    return;
  }
  const total = mine.reduce((s,id)=>s+totalOf(id),0);
  const names = mine.map(id=>`#${id} ${DATA.names[id-1]}`).join(' · ');
  const n = mine.reduce((s,id)=>s+(wins[id]||[]).length,0);
  el.innerHTML = `<div class="pin">★</div><div class="t"><b>${names}</b><span>${n} win${n==1?'':'s'} so far · tap to open</span></div><div class="amt tnum">${money(total)}</div>`;
  el.style.cursor='pointer'; el.onclick=()=>openSquare(mine[0]);
}

function results(){
  const el = $('#results');
  const list = DATA.games.filter(g=>filter==='all'||g.round==filter).slice().reverse(); // newest first
  let h = '', day = '';
  list.forEach(g=>{
    if(g.date!==day){ day=g.date; h += `<div class="day">${g.date}</div>`; }
    const own = DATA.names[g.cell-1], isMine = mine.includes(g.cell);
    h += `<button class="game${isMine?' mine-win':''}" data-id="${g.cell}">
      <div class="rt"><i style="--c:var(--r${g.round})"></i>${ROUND[g.round][1]}</div>
      <div class="tm won"><span class="sd">${g.w.s}</span><span class="n">${g.w.n}</span><span class="sc tnum">${g.w.p}</span></div>
      <div class="tm lost"><span class="sd">${g.l.s}</span><span class="n">${g.l.n}</span><span class="sc tnum">${g.l.p}</span></div>
      <div class="sq"><span>Square #${g.cell}</span><b>${own}</b><em>+${money(PAYOUT[g.round])}</em></div>
    </button>`;
  });
  el.innerHTML = h || `<div class="empty"><b>No games yet</b>Results will appear here once this round tips off.</div>`;
  el.querySelectorAll('.game').forEach(b=>b.onclick=()=>openSquare(+b.dataset.id));
}

function leaders(){
  const rows = DATA.names.map((n,i)=>({id:i+1,n,t:totalOf(i+1),w:wins[i+1]||[]})).filter(x=>x.t>0).sort((a,b)=>b.t-a.t);
  const pot = rows.reduce((s,x)=>s+x.t,0), max = rows[0]?.t||1;
  $('#stats').innerHTML = `<div><b class="tnum">${money(pot)}</b><span>Paid out</span></div><div><b class="tnum">${rows.length}</b><span>Squares paid</span></div><div><b class="tnum">${DATA.games.length}</b><span>Games played</span></div>`;
  $('#leaders').innerHTML = rows.map((x,i)=>`<button class="lead${mine.includes(x.id)?' mine':''}" data-id="${x.id}">
    <div class="rk">${i+1}</div>
    <div class="nm"><span>${x.n}</span><small>#${x.id} · ${x.w.length} win${x.w.length==1?'':'s'}</small></div>
    <div class="amt tnum">${money(x.t)}</div>
    <div class="bar" style="width:${Math.max(8, x.t/max*100)}%">${x.w.slice().sort((a,b)=>b.round-a.round).map(g=>`<i style="--c:var(--r${g.round});flex:${PAYOUT[g.round]}"></i>`).join('')}</div>
  </button>`).join('');
  $('#leaders').querySelectorAll('.lead').forEach(b=>b.onclick=()=>openSquare(+b.dataset.id));
}

/* Bottom sheet */
let lastFocus = null;
function openSquare(id){
  const w = (wins[id]||[]).slice().sort((a,b)=>b.round-a.round);
  const col = DATA.cols[(id-1)%10], row = DATA.rows[Math.floor((id-1)/10)];
  $('#sh-num').textContent = '#'+id;
  $('#sh-title').textContent = DATA.names[id-1];
  $('#sh-sub').textContent = `Wins when the winner's score ends in ${col} and the loser's ends in ${row}`;
  const isMine = mine.includes(id);
  $('#sh-body').innerHTML = `
    <div class="total"><span>Total winnings</span><b class="tnum">${money(totalOf(id))}</b></div>
    <button class="setmine" id="setmine" aria-pressed="${isMine}">${isMine?'★ This is my square':'This is my square'}</button>
    ${w.length ? w.map(g=>`<div class="win"><i style="--c:var(--r${g.round})"></i><div class="m"><b>${g.w.n} ${g.w.p}, ${g.l.n} ${g.l.p}</b><span>${ROUND[g.round][1]} · ${g.date}</span></div><div class="p tnum">+${money(PAYOUT[g.round])}</div></div>`).join('')
      : `<div class="empty"><b>No wins yet</b>Still ${6-Math.max(...played)} round${6-Math.max(...played)==1?'':'s'} left to hit ${col}–${row}.</div>`}`;
  $('#setmine').onclick = ()=>{
    if(mine.includes(id)) mine = mine.filter(x=>x!==id); else mine.push(id);
    saveMine(); render(); openSquare(id); toast(mine.includes(id)?`Saved #${id} as your square`:`Removed #${id}`);
  };
  lastFocus = document.activeElement;
  $('#sheet').setAttribute('aria-hidden','false'); $('#scrim').classList.add('on');
  $('#main').style.overflow='hidden'; document.body.style.overflow='hidden';
  setTimeout(()=>$('#sh-close').focus(), 50);
}
function closeSheet(){
  $('#sheet').setAttribute('aria-hidden','true'); $('#scrim').classList.remove('on');
  $('#main').style.overflow=''; document.body.style.overflow='';
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}
$('#sh-close').onclick = closeSheet; $('#scrim').onclick = closeSheet;
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && $('#sheet').getAttribute('aria-hidden')==='false') closeSheet(); });
// swipe down to dismiss
(()=>{ let y0=null; const sh=$('#sheet');
  sh.addEventListener('touchstart',e=>{ y0 = $('#sh-body').scrollTop===0 ? e.touches[0].clientY : null; },{passive:true});
  sh.addEventListener('touchmove',e=>{ if(y0!==null && e.touches[0].clientY-y0>70){ y0=null; closeSheet(); } },{passive:true});
})();

let tt; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),1800); }

/* Tabs */
function showView(v){
  document.querySelectorAll('.view').forEach(s=>s.classList.toggle('on', s.id==='v-'+v));
  document.querySelectorAll('.tabbar [role=tab]').forEach(b=>b.setAttribute('aria-selected', b.dataset.v===v));
  $('#main').scrollTop = 0; try{ localStorage.setItem('sb.view', v); }catch(e){}
}
document.querySelectorAll('.tabbar [role=tab]').forEach(b=>b.onclick=()=>showView(b.dataset.v));
$('#btn-find').onclick = ()=>{ showView('board'); $('#q').focus(); $('#q').scrollIntoView({block:'center'}); };
$('#q').addEventListener('input', e=>{ query = e.target.value.trim().toLowerCase(); board(); hits(); });
$('#clr').onclick = ()=>{ $('#q').value=''; query=''; board(); hits(); $('#q').focus(); };
$('#z-fit').onclick = ()=>{ zoom='fit'; $('#z-fit').setAttribute('aria-pressed',true); $('#z-big').setAttribute('aria-pressed',false); board(); };
$('#z-big').onclick = ()=>{ zoom='big'; $('#z-big').setAttribute('aria-pressed',true); $('#z-fit').setAttribute('aria-pressed',false); board(); };

function render(){ seg($('#seg')); seg($('#seg2')); board(); hits(); mineStrip(); results(); leaders(); }
const last = DATA.games[DATA.games.length-1];
$('#subline').textContent = `${DATA.games.length} games · last: ${last.w.n} ${last.w.p}–${last.l.p} ${last.l.n}`;
render();
try { const v = localStorage.getItem('sb.view'); if(v) showView(v); } catch(e){}
</script>
