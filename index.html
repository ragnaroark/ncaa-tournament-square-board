                    <div class="rounds-legend" id="rounds-legend"></div>
                    <div class="zoom" role="group" aria-label="Board size">
                        <button type="button" id="zoom-fit" aria-pressed="true">Fit</button><button type="button" id="zoom-large" aria-pressed="false">Large</button>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <div class="col-side">
        <section class="view" id="view-results" aria-labelledby="tab-results">
            <div class="roundseg" id="round-filter-results" role="group" aria-label="Filter results by round"></div>
            <div id="games-container"></div>
        </section>

        <section class="view" id="view-leaders" aria-labelledby="tab-leaders">
            <div class="stats" id="stats"></div>
            <h2>Leaders <small>tap a name for details</small></h2>
            <div id="leaders-container"></div>
        </section>
    </div>
    </div>

    <nav class="tabbar" role="tablist" aria-label="Sections">
        <button type="button" role="tab" id="tab-board" aria-selected="true" data-view="board">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg>Board
        </button>
        <button type="button" role="tab" id="tab-results" aria-selected="false" data-view="results">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Results
        </button>
        <button type="button" role="tab" id="tab-leaders" aria-selected="false" data-view="leaders">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>Leaders
        </button>
    </nav>

    <div class="sheet-scrim" id="sheet-scrim"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="sheet-title">
        <div class="sheet-grab"></div>
        <div class="sheet-head">
            <div class="sheet-num" id="sheet-num">#</div>
            <div class="sheet-text"><h3 id="sheet-title"></h3><p id="sheet-sub"></p></div>
            <button class="sheet-close" id="sheet-close" type="button" aria-label="Close">&times;</button>
        </div>
        <div class="sheet-body" id="sheet-body"></div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
</div>

<script src="games.js"></script>
<script src="script.js"></script>
</body>
</html>
